<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15306B"/>
      <stop offset="1" stop-color="#0A1A3C"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#D8E2F0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- molecule accent, echoing the wordmark -->
  <g stroke="#2BA8FF" stroke-width="2.1" fill="#2BA8FF">
    <line x1="47" y1="14" x2="54" y2="19"/>
    <line x1="47" y1="14" x2="44" y2="22"/>
    <circle cx="47" cy="13" r="3.4"/>
    <circle cx="55" cy="20" r="2.6"/>
    <circle cx="43" cy="23" r="2.4"/>
  </g>
  <!-- lab mouse in profile -->
  <g>
    <!-- tail -->
    <path d="M14 46 C7 46 6 38 12 36" fill="none" stroke="#F0A9B7" stroke-width="2.4" stroke-linecap="round"/>
    <!-- haunch + body -->
    <ellipse cx="29" cy="39" rx="15" ry="11" fill="url(#fur)"/>
    <!-- ear -->
    <circle cx="27" cy="29" r="6.6" fill="url(#fur)"/>
    <circle cx="27.6" cy="29.4" r="3.6" fill="#F3A8B8"/>
    <!-- head -->
    <path d="M38 32 C46 32 52 37 52 41 C52 44 48 46 43 46 L34 46 C32 41 33 34 38 32 Z" fill="url(#fur)"/>
    <!-- eye -->
    <circle cx="43" cy="38.5" r="2.1" fill="#1B2A44"/>
    <circle cx="43.7" cy="37.8" r="0.7" fill="#ffffff"/>
    <!-- snout -->
    <circle cx="52" cy="41.5" r="1.9" fill="#E88FA3"/>
    <!-- whiskers -->
    <g stroke="#9FB2CC" stroke-width="1" stroke-linecap="round">
      <line x1="52" y1="43" x2="60" y2="45"/>
      <line x1="52" y1="42" x2="60" y2="40"/>
    </g>
  </g>
</svg>
